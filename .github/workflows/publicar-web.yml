name: Versão web

# Monta a versão web, testa em um navegador real e publica no GitHub Pages.
# Em pull requests só monta e testa; a publicação acontece no merge para a main.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "src/**"
      - "examples/*.xlsx"
      - "scripts/build_web.py"
      - "tests/web/**"
      - ".github/workflows/publicar-web.yml"
  pull_request:
    paths:
      - "web/**"
      - "src/**"
      - "examples/*.xlsx"
      - "scripts/build_web.py"
      - "tests/web/**"
      - ".github/workflows/publicar-web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  montar-e-testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Montar o site
        run: |
          pip install pyyaml
          python scripts/build_web.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Testar no navegador
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
          python -m http.server -d site 8000 &
          sleep 2
          node tests/web/e2e.js http://localhost:8000/

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site

  publicar:
    needs: montar-e-testar
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
